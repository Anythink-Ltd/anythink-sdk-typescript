name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      # main can be red while CI runs in parallel, so nothing publishes unverified
      - run: bun run lint && bun run typecheck && bun run test:coverage && bun run check:package
      # npm trusted publishing (OIDC): no token secret, provenance is attached automatically
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: bun run release
          pr-title: Version packages
          commit-message: Version packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
